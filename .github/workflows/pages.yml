name: Validate public build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_ONLY: 'true'
          VITE_RESEARCH_API_ORIGIN: ${{ vars.HISTORY_RESEARCH_API_ORIGIN }}
