<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ec" />
    <link rel="icon" href="data:," />
    <meta name="description" content="输入历史问题，查看史料、对照情景与可以复算的反事实分析。" />
    <title>历史改写 · History Rewritten</title>
  </head>
  <body>
    <header class="masthead">
      <div class="wrap nav">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✦</span><span>历史改写<small>HISTORY REWRITTEN</small></span></a>
        <nav aria-label="主导航">
          <a href="#examples">案例</a>
          <a class="github" href="https://github.com/hoanacantincus-cmd/history-rewritten">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span></span>开源历史反事实实验室</p>
          <h1 id="hero-title">如果历史<br><em>换一种走法？</em></h1>
          <p class="intro">写一句你想改写的历史。查看不同走向、模型概率，以及结论背后的史料。</p>
          <div id="demo-entry" class="action-row">
            <a class="button primary" href="#examples">试一个案例 <span aria-hidden="true">↓</span></a>
            <label class="button secondary import-button">导入分析包<input type="file" id="import" accept=".json,application/json" /></label>
          </div>
          <form id="research-form" hidden>
            <div class="question-input">
              <label class="if-prefix" for="question">如果</label>
              <textarea id="question" name="question" required maxlength="1197" rows="2" placeholder="1905 年日本在和谈中坚持要求赔款……"></textarea>
            </div>
            <div class="action-row"><button class="button primary" type="submit" id="research-button">开始推演 <span aria-hidden="true">→</span></button><button type="button" class="button secondary" id="local-import">导入分析包</button></div>
          </form>
          <p class="hero-note" id="mode-note">公开演示可离线复算。<a href="https://github.com/hoanacantincus-cmd/history-rewritten#自托管">如何分析新事件 ↗</a></p>
        </div>
        <figure class="atlas">
          <div class="atlas-image">
            <img src="/world-map.webp" alt="奥特里乌斯绘制的旧版世界地图" width="1100" height="720" />
          </div>
          <figcaption><i aria-hidden="true"></i><span>世界地图 · 亚伯拉罕·奥特里乌斯</span><a href="https://library.missouri.edu/specialcollections/items/show/1339">查看馆藏 ↗</a></figcaption>
        </figure>
      </section>
      <div id="status" role="status" aria-live="polite" hidden></div>
      <section id="examples" class="examples" aria-labelledby="examples-title">
        <div class="section-head"><h2 id="examples-title">从一个分岔点开始</h2><span>可交互案例</span></div>
        <div class="example-grid">
          <button class="example" type="button" data-case="lottery-1788"><span class="example-meta">制度 · 1788</span><strong>如果一次表决改由抽签决定？</strong><span class="example-link">查看条件概率 <span aria-hidden="true">↗</span></span></button>
          <button class="example" type="button" data-case="alaska-1867"><span class="example-meta">经济 · 1867</span><strong>如果阿拉斯加购地款分两期支付？</strong><span class="example-link">比较付款情景 <span aria-hidden="true">↗</span></span></button>
          <button class="example" type="button" data-case="ming-1644"><span class="example-meta">政治 · 1644</span><strong>如果崇祯授权太子在南京监国？</strong><span class="example-link">比较交接条件 <span aria-hidden="true">↗</span></span></button>
        </div>
      </section>
      <section id="results" class="results" aria-labelledby="results-title" tabindex="-1" hidden></section>
    </main>
    <footer class="wrap footer"><span>历史改写 · History Rewritten</span><a href="https://github.com/hoanacantincus-cmd/history-rewritten#分析方法">分析方法 ↗</a></footer>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
